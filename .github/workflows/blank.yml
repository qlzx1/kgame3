name: Run  Bot

on:
  push:
    branches: [ main ]      # push 到 main 分支时触发
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时运行一次（可删除或修改）
  workflow_dispatch:        # 支持手动触发

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install pytelegrambotapi telethon

      - name: 运行 Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}   # 如果没加这个 Secret，可以删掉这行
        run: |
          python your_script.py
